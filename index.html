<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://serafina-ai.vercel.app/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Serafina</title>
    <meta name="title" content="Serafina" />
    <meta name="description" content="Talk with Serafina - your private consultant online for all things sensible or uncanny. Decentralized and self-hosted LLM platform brought to you by MuxAI." />
    <meta name="author" content="MuxAI" />

    <!-- Custom / AEO Meta Tags -->
    <meta name="type" content="Fictional Character" />
    <meta name="organization" content="MuxAI" />

    <!-- Open Graph / Facebook (Controls how links look on social media) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chat with Serafina" />
    <meta property="og:title" content="Serafina" />
    <meta property="og:description" content="Talk with Serafina - your private consultant online for all things sensible or uncanny. Decentralized and self-hosted LLM platform brought to you by MuxAI." />
    <meta property="og:image" content="https://muxai.vercel.app/aismash_banner.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Serafina" />
    <meta property="twitter:description" content="Talk with Serafina - your private consultant online for all things sensible or uncanny. Decentralized and self-hosted LLM platform brought to you by MuxAI." />
    <meta property="twitter:image" content="https://muxai.vercel.app/aismash_banner.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- JSON-LD Structured Data for Answer Engines (AEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "Serafina",
          "alternateName": "Seraphina",
          "description": "Talk with Serafina - your private consultant online for all things sensible or uncanny. Decentralized and self-hosted LLM platform brought to you by MuxAI.",
          "image": "https://muxai.vercel.app/aismash_banner.png",
          "affiliation": {
            "@type": "Organization",
            "name": "MuxAI"
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#f8f9fc] text-[#1e2029] antialiased selection:bg-amber-500/20 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
